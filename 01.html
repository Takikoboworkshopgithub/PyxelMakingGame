
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pyxel Game</title>

    <!-- Pyxel Web Runtime -->
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: #101020;
            color: #ffffff;
            font-family: sans-serif;
        }

        h1 {
            font-size: 1.5rem;
        }

        .game-container {
            padding: 16px;
            background: #202038;
            border: 2px solid #00ffff;
            border-radius: 8px;
        }

        .back-link {
            color: #00ffff;
        }
    </style>
</head>

<body>
    <h1>Pyxel Game</h1>

    <div class="game-container">
        <!-- 読み込むPythonファイルを指定 -->
        <pyxel-run root="." name="01.py"></pyxel-run>
    </div>

    <a class="back-link" href="./index.html">
        ← 問題一覧に戻る
    </a>
</body>
</html>
