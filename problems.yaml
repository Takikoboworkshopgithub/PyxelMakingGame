- id: "01"
  title: "四角形を動かそう"
  description: |
    画面に表示された四角形を、左右の矢印キーで操作しましょう。
    四角形は画面の外に出ないように制御されています。
  instructions:
    - "← → キーで四角形を左右に移動させてください。"
    - "四角形の位置を表す x 座標が、どのように変化するか観察しましょう。"
    - "画面の端で移動が止まる仕組みを確認しましょう。"

- id: "02"
  title: "ジャンプしてみよう"
  description: |
    上矢印キーでジャンプできるゲームを作りましょう。
    プレイヤーは上昇したあと、重力によって落下します。
    地面に着地すると、もう一度ジャンプできるようになります。
  instructions:
    - "← → キーで左右に移動してください。"
    - "↑ キーを押してジャンプしてください。"
    - "速度を表す vy と重力によって、ジャンプの軌道がどのように変化するか観察しましょう。"
    - "空中にいる間は、再びジャンプできない仕組みを確認しましょう。"

- id: "03"
  title: "カウンターを作ろう"
  description: |
    キー入力に応じて数値が増減するカウンターを作りましょう。
    現在の数値は画面上に表示されます。
  instructions:
    - "↑ キーを押すとカウントが 1 増えます。"
    - "↓ キーを押すとカウントが 1 減ります。"
    - "pyxel.btnp() と pyxel.btn() の違いを意識しましょう。"
    - "数値を更新する処理と、画面に表示する処理の違いを確認しましょう。"

- id: "04"
  title: "隠されたポイントを探せ"
  description: |
    画面のどこかに、目標となるポイントが隠されています。
    プレイヤーを動かすと、目標までの距離が表示されます。
    距離を手がかりにポイントの位置を推測しましょう。
  instructions:
    - "矢印キーでプレイヤーを上下左右に移動させてください。"
    - "表示される Distance の数値を見ながら、目標に近づきましょう。"
    - "Space キーで答え合わせをします。"
    - "目標との距離が 10 以下ならクリア、そうでなければゲームオーバーです。"
    - "2点間の距離を計算する方法と、ゲームの状態を管理する方法を確認しましょう。"

- id: "05"
  title: "2人のプレイヤーを操作しよう"
  description: |
    画面には、異なるキーで操作できる2人のプレイヤーが登場します。
    2人が衝突するとゲームオーバーになります。
    クラスの継承を利用して、それぞれ異なる操作方法を実現しましょう。
  instructions:
    - "プレイヤー1は W・A・S・D キーで操作します。"
    - "プレイヤー2は矢印キーで操作します。"
    - "2人が重ならないように移動させましょう。"
    - "2つの四角形が重なったかどうかを判定する方法を確認しましょう。"
    - "親クラス Player と子クラス WASDPlayer・ArrowPlayer の役割を確認しましょう。"

- id: "06"
  title: "隕石を避けろ"
  description: |
    上から落ちてくる隕石を避け続けるゲームです。
    隕石は画面の外に出ると、再び上から落ちてきます。
    どれか1つでも隕石に衝突するとゲームオーバーです。
  instructions:
    - "← → キーでプレイヤーを左右に移動させてください。"
    - "複数の隕石を避け続けましょう。"
    - "隕石が画面の下まで落ちたときの動きを観察しましょう。"
    - "リストに格納した複数のオブジェクトを、繰り返し処理で更新・描画する方法を確認しましょう。"
    - "プレイヤーと隕石の衝突判定を確認しましょう。"

- id: "07"
  title: "足場を渡ってゴールを目指せ"
  description: |
    高さの異なるブロックをジャンプで渡り、最後の足場を目指しましょう。
    ブロックの上に着地すると、その足場から再びジャンプできます。
    画面の下に落ちると、スタート地点に戻されます。
  instructions:
    - "← → キーで移動し、Space キーでジャンプしてください。"
    - "足場の位置や高さを考えながら、最後のブロックを目指しましょう。"
    - "ブロックの上から着地したかどうかを判定する方法を確認しましょう。"
    - "最後のブロックに到達するとクリアです。"
    - "座標と速度を使って、キャラクターの移動や着地を管理する仕組みを理解しましょう。"

- id: "08"
  title: "地形を攻略しよう"
  description: |
    このゲームには、上から乗れる足場と、上下左右からぶつかるブロックがあります。
    地形の種類によって衝突判定を変えながら、プレイヤーを操作しましょう。
  instructions:
    - "← → キーで移動し、Space キーでジャンプしてください。"
    - "薄い足場には上から乗れますが、横からは通り抜けられます。"
    - "通常のブロックでは、横からの衝突や下から頭をぶつける衝突も発生します。"
    - "地形の種類を表す kind によって、衝突判定の処理が切り替わる仕組みを確認しましょう。"
    - "移動前の座標と移動後の座標を比較する理由を考えましょう。"
