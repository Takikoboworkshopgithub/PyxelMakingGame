- id: "01"
  title: "Move Rect"
  description: |
    画面に表示された四角形を、左右の矢印キーで操作しましょう。
    四角形は画面の外に出ないように制御されています。
  instructions:
    - "← → キーで四角形を左右に移動させてください。"
    - "四角形の位置を表す x 座標が、どのように変化するか観察しましょう。"
    - "画面の端で移動が止まる仕組みを確認しましょう。"

- id: "02"
  title: "Do Jump"
  description: |
    上矢印キーでジャンプできるゲームを作りましょう。
    プレイヤーは上昇したあと、重力によって落下します。
    地面に着地すると、もう一度ジャンプできるようになります。
  instructions:
    - "← → キーで左右に移動してください。"
    - "↑ キーを押してジャンプしてください。"
    - "速度を表す vy と重力によって、ジャンプの軌道がどのように変化するか観察しましょう。"
    - "空中にいる間は、再びジャンプできない仕組みを確認しましょう。"

- id: "03"
  title: "Make Counter"
  description: |
    キー入力に応じて数値が増減するカウンターを作りましょう。
    現在の数値は画面上に表示されます。
  instructions:
    - "↑ キーを押すとカウントが 1 増えます。"
    - "↓ キーを押すとカウントが 1 減ります。"
    - "pyxel.btnp() と pyxel.btn() の違いを意識しましょう。"
    - "数値を更新する処理と、画面に表示する処理の違いを確認しましょう。"

- id: "04"
  title: "Find The Flag"
  description: |
    画面のどこかに、目標となるポイントが隠されています。
    プレイヤーを動かすと、目標までの距離が表示されます。
    距離を手がかりにポイントの位置を推測しましょう。
  instructions:
    - "矢印キーでプレイヤーを上下左右に移動させてください。"
    - "表示される Distance の数値を見ながら、目標に近づきましょう。"
    - "Space キーで答え合わせをします。"
    - "目標との距離が 10 以下ならクリア、そうでなければゲームオーバーです。"
    - "2点間の距離を計算する方法と、ゲームの状態を管理する方法を確認しましょう。"

- id: "05"
  title: "Manipulate Two Players"
  description: |
    画面には、異なるキーで操作できる2人のプレイヤーが登場します。
    2人が衝突するとゲームオーバーになります。
    クラスの継承を利用して、それぞれ異なる操作方法を実現しましょう。
  instructions:
    - "プレイヤー1は W・A・S・D キーで操作します。"
    - "プレイヤー2は矢印キーで操作します。"
    - "2人が重ならないように移動させましょう。"
    - "2つの四角形が重なったかどうかを判定する方法を確認しましょう。"
    - "親クラス Player と子クラス WASDPlayer・ArrowPlayer の役割を確認しましょう。"

- id: "06"
  title: "Avoid Falling Rocks"
  description: |
    上から落ちてくる隕石を避け続けるゲームです。
    隕石は画面の外に出ると、再び上から落ちてきます。
    どれか1つでも隕石に衝突するとゲームオーバーです。
  instructions:
    - "← → キーでプレイヤーを左右に移動させてください。"
    - "複数の隕石を避け続けましょう。"
    - "隕石が画面の下まで落ちたときの動きを観察しましょう。"
    - "リストに格納した複数のオブジェクトを、繰り返し処理で更新・描画する方法を確認しましょう。"
    - "プレイヤーと隕石の衝突判定を確認しましょう。"

- id: "07"
  title: "Jump Over Blocks"
  description: |
    高さの異なるブロックをジャンプで渡り、最後の足場を目指しましょう。
    ブロックの上に着地すると、その足場から再びジャンプできます。
    画面の下に落ちると、スタート地点に戻されます。
  instructions:
    - "← → キーで移動し、Space キーでジャンプしてください。"
    - "足場の位置や高さを考えながら、最後のブロックを目指しましょう。"
    - "ブロックの上から着地したかどうかを判定する方法を確認しましょう。"
    - "最後のブロックに到達するとクリアです。"
    - "座標と速度を使って、キャラクターの移動や着地を管理する仕組みを理解しましょう。"


- id: "08"
  title: "Maze Runner"
  description: |
    迷路の中を四角形を操作して進みましょう。
    壁をすり抜けずに移動するには、どのような仕組みが必要でしょうか。
  instructions:
    - "矢印キーで四角形を上下左右に移動させてください。"
    - "壁にぶつかったとき、四角形の動きがどうなるか観察しましょう。"
    - "迷路を構成する壁と通路が、どのように管理されているか考えましょう。"

- id: "09"
  title: "Enemy Maze"
  description: |
    迷路の中を移動し、敵を避けながらゴールを目指しましょう。
    敵は一定時間ごとに、壁にぶつからない方向へランダムに移動します。
    敵の動きを制御するプログラムを完成させましょう。
  instructions:
    - "矢印キーでプレイヤーを操作し、迷路のゴールを目指してください。"
    - "迷路が二次元配列で管理され、壁の位置によって移動が制限される仕組みを確認しましょう。"
    - "敵が移動できる方向を調べ、移動可能な方向からランダムに1つ選ぶ処理を実装しましょう。"


- id: "10"
  title: "dot player"
  description: |
    RPGのように上から見下ろす迷路ゲームです。
    矢印キーでプレイヤーを操作し、迷路の中を探索しましょう。
    キー入力に応じてプレイヤーの位置や向きを変更する処理を実装しましょう。
  instructions:
    - "矢印キーでプレイヤーを上下左右に移動させましょう。"
    - "移動した方向に応じて、プレイヤーの向きが変わることを確認しましょう。"
    - "タイルマップとプレイヤーの画像を描画する処理を確認しましょう。"

- id: "11"
  title: "dot player with collision"
  description: |
    プレイヤーを滑らかに移動させ、壁をすり抜けないようにしましょう。
    移動先の地形を調べ、移動できるかどうかを判定する処理を実装しましょう。
  instructions:
    - "矢印キーを押し続けると、プレイヤーが滑らかに移動するようにしましょう。"
    - "プレイヤーが移動する先のタイルを調べ、石がある方向へ移動できないようにしましょう。"
    - "移動中のプレイヤーをアニメーションさせ、向きに応じて画像を切り替えましょう。"

- id: "12"
  title: "scrolling tilemap"
  description: |
    RPGのように上から見下ろすゲームを発展させましょう。
    プレイヤーを画面中央に固定し、移動に合わせて地形をスクロールさせます。
    カメラの座標を変更して、広いマップを探索できる仕組みを実装しましょう。
  instructions:
    - "矢印キーでプレイヤーの向きを変え、移動に合わせてタイルマップをスクロールさせましょう。"
    - "プレイヤーを画面中央に固定し、カメラの座標を変更して地形が動いて見えるようにしましょう。"
    - "タイルマップの座標と画面上の座標の違いを理解しましょう。"
    - "移動先のタイルを調べ、石がある方向には進めないようにしましょう。"